$schema: https://json-schema.org/draft/2020-12/schema
additionalProperties: true
description: |-
  The free text of one official web page, in reading order, so a new site can reuse the
  organizer's own copy (hero text, section intros, templates) without scraping again.
properties:
  description:
    anyOf:
    - type: string
    - type: 'null'
    default: null
    title: Description
  id:
    pattern: ^(page):[a-z0-9][a-z0-9._/@+-]*$
    title: Id
    type: string
  sections:
    description: Empty for pages that are only a catalog widget.
    items:
      $ref: '#/$defs/PageSection'
    title: Sections
    type: array
  site:
    enum:
    - githubuniverse.com
    - attendee-portal
    title: Site
    type: string
  sources:
    items:
      $ref: '#/$defs/Source'
    title: Sources
    type: array
  title:
    title: Title
    type: string
  url:
    pattern: ^https?://
    title: Url
    type: string
required:
- id
- site
- sources
- title
- url
title: Page
type: object
