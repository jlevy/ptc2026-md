      text descriptions, material properties)- Implemented real-time search API with sub-100ms response
      times despite massive dataset scale- Developed custom embedding models fine-tuned specifically for
      textile pattern recognition and similarity detectionTech Stack: Go, Python, Milvus, Firebase, C
      Extensions, Custom Vector Embeddings, Distributed Systems, Edge Computing, Image Processing APIs'
