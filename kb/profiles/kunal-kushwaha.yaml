  - kind: project
    title: Genetic Algorithm, Evolutionary Algorithms for COVID-19 Vaccines
    detail: In this research, an optimized deep learning method was proposed to explore the possibility
      and practicality of neural net-work applications in medical imaging. The method was used to achieve
      the goal of judging common pneumonia and even COVID-19 more effectively. Where, the genetic algorithm
      was taken advantage to optimize the Dropout module, which is essential in neural networks so as
      to improve the performance of typical neural network models. The experiment results demonstrate
      that the proposed method shows excellent performance and strong practicability in judging pneumonia,
      and the application of advanced artificial intelligence technology in the field of medical imaging
