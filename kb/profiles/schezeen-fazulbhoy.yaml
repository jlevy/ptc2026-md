      observed_at: '2026-10-24T21:13:34Z'
  - kind: project
    title: 'Intelli-intent: Intent-based search using Machine Learning'
    detail: 'An intelligent search engine for classifying the intent of a query. It uses the LSTM model
      trained on the BBC news dataset http://mlg.ucd.ie/datasets/bbc.html. It fetches the data directory
      from Sharepoint. For example, if the user were to search the sharepoint directory with the query
      "research on India", Intelli-intent would display all those documents whose content is in the relative
      sphere of the query - regardless of the name of the document, parent folder or sub folder.Intelli-Intent
      won the first place at the EY Hackathon: GDS Hackpions 1.0.Tech Stack: React, Flask, and ElasticSearch'
    evidence:
      url: https://www.linkedin.com/in/schezeenfazulbhoy
      observed_at: '2026-10-24T21:13:34Z'
  - kind: project
    title: JADEN (Jenkins Ansible DEployment for Nomura)
    detail: '''JADEN'' is a generic continuous deployment framework developed in order to replace the
      enterprise licensed software - Atomic, which was earlier used in the CI/CD pipelines. JADEN is compatible
      with various deployment artifacts (wars/jars/ears/Informatica/database), allowing seamless migration
      of the project across integration, stage, pre-production, and production environments. A multi-stage
      pipeline managed by Jenkins, customized using Ansible and Python. This project earned the team the
      quarterly ''STAR'' award at Nomura.Tech Stack: Python, Ansible, Ansible-Galaxy, Ansible-Playbooks,
