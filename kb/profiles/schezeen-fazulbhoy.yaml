  - kind: project
    title: SPOT - Chrome Browser Extension
    detail: 'SPOT is a browser extension that allows you to add music ''spotted'' on the web, to your
      Spotify playlists on the ''SPOT'', eliminating the overhead of switching tabs or manually querying
      for the song.Features:• Directly fetch the Spotify equivalent of the song playing on an active Youtube
      tab within the extension• Preview the queried song within the extension panel on the same tab• Add
      selected song to multiple Spotify playlists simultaneously, in real time• Query plain-text song
      titles using the right-click triggered context menuDeveloped With: JavaScript, Chrome Browser API,
      Spotify API, RegexAnalytics: Chrome Developer Dashboard, Spotify Developer DashboardStatus: Open-sourced,
      maintain on Github'
    evidence:
      url: https://www.linkedin.com/in/schezeenfazulbhoy
      observed_at: '2026-10-24T21:13:34Z'
  - kind: project
    title: IVI - Intelligent Visual Identification using NLP
    detail: 'IVI or ''Intelligent Visual Identifier'' is an automated sytem the highlights violations
      against the brand guidelines in a presentation deck. IVI also serves as an like icon predictor,
      image analysis and real-time voice based notes caturing assistant.IVI won the first place at the
      EY Hackathon: GDS Hackpions 2.0.Tech Stack: React.js, ELK Stack (Elastic Search, LogStash, Kibana),
